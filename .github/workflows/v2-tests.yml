name: V2 tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "PySide6>=6.6,<7" ruff
      - run: python -m ruff check --select F821,F822,F823,E9 vscexplorer.py test_vscexplorer_v2.py
      - run: python -m unittest -v test_vscexplorer_v2
      - run: python vscexplorer.py --self-test
      - run: python -m py_compile vscexplorer.py test_vscexplorer_v2.py
